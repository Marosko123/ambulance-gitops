apiVersion: polyfea.github.io/v1alpha1
kind: WebComponent
metadata:
  name: mb-ambulance-ufe-content
spec:
  microFrontend: mb-ambulance-ufe
  element: mb-ambulance-wl-app
  attributes:
    - name: api-base
      value: http://localhost:5000/api
    - name: ambulance-id
      value: bobulova
  displayRules:
    - allOf:
        - context-name: main-content
        - path: "^(\\.?/)?mb-ambulance-wl(/.*)?$"
